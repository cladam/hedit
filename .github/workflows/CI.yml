name: Build, Test, and Release

permissions:
  contents: write

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (${{ matrix.artifact }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: hedit-linux-x86_64
          - os: ubuntu-24.04-arm
            artifact: hedit-linux-arm64
          - os: macos-latest
            artifact: hedit-macos-arm64
          - os: windows-latest
            artifact: hedit-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Koka (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -sSL https://github.com/koka-lang/koka/releases/latest/download/install.sh | sudo sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Koka (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl -sSL -o "$env:TEMP\install-koka.bat" https://github.com/koka-lang/koka/releases/latest/download/install.bat
          & "$env:TEMP\install-koka.bat"
          "$env:LOCALAPPDATA\koka\bin" | Out-File -Append -FilePath $env:GITHUB_PATH

      - name: Install hica compiler (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://www.hica.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install hica compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl -fsSL -o "$env:TEMP\install-hica.ps1" https://www.hica.dev/install.ps1
          & "$env:TEMP\install-hica.ps1"
          "$env:LOCALAPPDATA\hica" | Out-File -Append -FilePath $env:GITHUB_PATH

      - name: Verify compiler versions
        run: |
          koka --version
          hica --version
        shell: bash

      - name: Build binary (Linux/MacOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$HOME/.hica/stdlib"
          hica fetch
          hica build -o hedit

      - name: Setup Windows Workarounds & Build Binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Create C:\bin directory for wrappers
          New-Item -ItemType Directory -Force -Path "C:\bin"

          # Persist C:\bin to GITHUB_PATH and prioritize .CMD in PATHEXT across ALL steps
          "C:\bin" | Out-File -Append -FilePath $env:GITHUB_PATH
          "PATHEXT=.CMD;.BAT;.EXE;.COM" | Out-File -Append -FilePath $env:GITHUB_ENV

          # Wrapper for system("./...") calls executed by hica test
          @'
          @echo off
          set "ARGS=%*"
          set "ARGS=%ARGS:/=\%"
          if "%ARGS:~0,1%"=="\" set "ARGS=%ARGS:~1%"
          %ARGS%
          '@ | Out-File -Encoding ascii -FilePath "C:\bin\.cmd"

          # Create helper wrappers in C:\Windows\ to strip single-quotes from curl/tar calls
          @'
          @echo off
          set "ARGS=%*"
          set "ARGS=%ARGS:'=%"
          C:\Windows\System32\curl.exe %ARGS%
          '@ | Out-File -Encoding ascii -FilePath "C:\Windows\curl.cmd"

          @'
          @echo off
          set "ARGS=%*"
          set "ARGS=%ARGS:'=%"
          C:\Windows\System32\tar.exe %ARGS%
          '@ | Out-File -Encoding ascii -FilePath "C:\Windows\tar.cmd"

          @'
          @echo off
          set "ARGS=%*"
          set "ARGS=%ARGS:/=\%"
          if "%ARGS:~0,1%"=="\" set "ARGS=%ARGS:~1%"
          %ARGS%
          '@ | Out-File -Encoding ascii -FilePath "C:\Windows\.cmd"

          # Build project binary
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.hica\stdlib"
          hica fetch
          hica build -o hedit.exe

      - name: Run unit tests (Unix)
        if: runner.os != 'Windows'
        run: |
          set +e
          failed=0
          ran=0
          for f in tests/*_test.hc; do
            [ -e "$f" ] || continue
            ran=$((ran + 1))
            echo "=== $f ==="
            output=$(hica test "$f" 2>&1)
            echo "$output"
            if echo "$output" | grep -q 'failed'; then
              failed=1
            fi
          done
          if [ "$ran" -eq 0 ]; then
            echo "error: no test files matched tests/*_test.hc"
            failed=1
          fi
          exit $failed

      - name: Run unit tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true # running tests fail due to path errors on Windows
        run: |
          $failed = 0
          $ran = 0
          Get-ChildItem tests/*_test.hc | ForEach-Object {
            $ran++
            $f = $_.FullName
            Write-Host "=== $f ==="
            
            # Run hica test to compile
            $output = & hica test $f 2>&1
            Write-Host $output

            $stem = [System.IO.Path]::GetFileNameWithoutExtension($f)
            $bin = "tests\$stem.exe"

            if (Test-Path $bin) {
              Write-Host "Running compiled test binary: $bin"
              & ".\$bin"
              if ($LASTEXITCODE -ne 0) {
                Write-Host "Test execution failed for $bin"
                $failed = 1
              }
            } elseif ($output -match "no tests found") {
              Write-Host "Skipping $stem (no test cases defined)"
            } else {
              Write-Host "Error: compilation failed or binary not found for $stem"
              $failed = 1
            }
          }
          if ($ran -eq 0) {
            Write-Error "error: no test files matched tests/*_test.hc"
            exit 1
          }
          if ($failed -eq 1) {
            exit 1
          }

      - name: Strip binary (Linux)
        if: runner.os == 'Linux'
        run: strip hedit

      - name: Ad-hoc codesign (macOS)
        if: runner.os == 'macOS'
        run: codesign --sign - --force hedit

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: tar czf ${{ matrix.artifact }}.tar.gz hedit

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path hedit.exe -DestinationPath ${{ matrix.artifact }}.zip

      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.tar.gz
            *.zip
            install.sh
